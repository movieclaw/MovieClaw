# 示例站点：一个 NexusPHP 架构的站点。把 site_id / display_name / base_url / categories
# 换成你要适配的站点；选择器与框架默认值不同的地方写进 selectors（见 _template.yaml）。
site_id: examplept
display_name: Example PT（数据包示例）
base_url: https://pt.example.com
framework: nexusphp

auth:
  supported: [cookie, credential]

selectors: {}

categories:
  movie: [401]
  tv: [402]
  documentary: [404]
  anime: [405]
