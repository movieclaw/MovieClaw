# DeepSeek 官方开放平台（api.deepseek.com，OpenAI 兼容）。
# 核实于 2026-10-13：
# https://api-docs.deepseek.com/quick_start/pricing/
# https://api-docs.deepseek.com/api/create-chat-completion/
# https://api-docs.deepseek.com/guides/thinking_mode/
# https://api-docs.deepseek.com/guides/vision/
# API 明确最大输出 384K = 393216；不使用十进制 384000。
# 思考强度 reasoning_effort（low/high/max，默认 high）；关闭使用 thinking.type。
# parallel_tool_calls 官方未公布，不声明。
id: deepseek
display_name: DeepSeek 官方
protocol: openai_chat
base_url: https://api.deepseek.com
compat:
  thinking_field: reasoning_content
  preserve_thinking: true
  supports_stream_usage: true
models:
  # 旗舰：1.6T 总参 / 49B 激活 MoE
  - id: deepseek-v4-pro
    context_window: 1048576
    max_output_tokens: 393216
    supports_tools: true
    supports_thinking: true
    thinking_control:
      kind: effort
      levels: [low, high, max]
      supports_off: true
      off_body: {thinking: {type: disabled}}
    modalities: [text]
  # 当前 Flash 稳定名称，实际版本 V4.1 Flash；原生文本/图片输入
  - id: deepseek-flash
    context_window: 1048576
    max_output_tokens: 393216
    supports_tools: true
    supports_thinking: true
    thinking_control:
      kind: effort
      levels: [low, high, max]
      supports_off: true
      off_body: {thinking: {type: disabled}}
    modalities: [text, image]
  # 兼容旧名：官方已将请求转给 V4.1 Flash，参数与能力跟随当前 Flash
  - id: deepseek-v4-flash
    context_window: 1048576
    max_output_tokens: 393216
    supports_tools: true
    supports_thinking: true
    thinking_control:
      kind: effort
      levels: [low, high, max]
      supports_off: true
      off_body: {thinking: {type: disabled}}
    modalities: [text, image]
  # 旧实验名称仍可调用，官方已转给正式 V4.1 Flash
  - id: deepseek-v4-flash-vision-exp
    context_window: 1048576
    max_output_tokens: 393216
    supports_tools: true
    supports_thinking: true
    thinking_control:
      kind: effort
      levels: [low, high, max]
      supports_off: true
      off_body: {thinking: {type: disabled}}
    modalities: [text, image]
