# MovieClaw 苹果平台工程定义（XcodeGen）：iPhone 版（MovieClaw）与 Apple TV 版（MovieClawTV）。
#
# 为什么用 XcodeGen 而不是直接提交 .xcodeproj：
# - .pbxproj 是机器生成的巨型文件，多人/多会话并行加文件时几乎必然冲突；
# - 这里按目录收录源码，新增 Swift 文件无需改工程文件，重新 `xcodegen` 即可。
# 生成：cd apps/apple && xcodegen generate（产物 MovieClaw.xcodeproj 已在 .gitignore）
name: MovieClaw
options:
  bundleIdPrefix: io.movieclaw
  # 界面全是中文（源码里的文案就是中文）：系统在 App 里画的文字按 App 声明的本地化选语言，
  # 只声明 en 时画中画占位「This video is playing in picture in picture.」、搜索框的取消键等一律是英文
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
packages:
  # 图片加载与缓存（MIT）：海报墙的解码降采样、内存/磁盘缓存、预取
  Nuke:
    url: https://github.com/kean/Nuke
    from: "13.0.0"
  # 自研引擎的内核（LGPL-3.0 + App Store 例外）：FFmpeg 解封装、就地换封装成 HLS 交给 AVPlayer，
  # AVPlayer 解不了的编码走 FFmpeg 软解 + 系统显示层。设计见 docs/design/player-engine.md。
  # 用仓库内的 Vendor/AetherEngine（上游 7.19.0 + 起播优化补丁，清单见其 PATCHES.md），
  # 补丁逐个提给上游，合并后回到直接引用上游版本。升级前要用语料回归（见设计文档「质量体系」）。
  AetherEngine:
    path: Vendor/AetherEngine
  # AetherEngine 自带的 FFmpeg（AetherLib* 动态框架，LGPL-2.1，无 GPL 组件）。
  # 单独声明是为了让 App 目标把这些动态框架嵌进包里（见 MovieClaw 目标的依赖说明）；
  # 版本必须与 AetherEngine 当前版本要求的一致，升级 AetherEngine 时一起改。
  FFmpegBuild:
    url: https://github.com/superuser404notfound/FFmpegBuild
    exactVersion: "3.6.0"
configFiles:
  # 开发者团队与 Bundle ID 前缀从本机 Signing.local.xcconfig 读（不入库），见 XcodeConfig/Signing.xcconfig
  Debug: XcodeConfig/Signing.xcconfig
  Release: XcodeConfig/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2 起的「易上手并发」：默认主线程隔离，UI 代码不必处处标 @MainActor
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MovieClaw:
    type: application
    platform: iOS
    sources:
      - path: MovieClaw
        type: syncedFolder
      # 与 Apple TV 版共用的代码（接口层、登录与账号、播放逻辑、主题与图片加载），见 docs/design/tvos-app.md §6
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      # 自研引擎经 AetherCore 动态框架间接引入（见下方 AetherCore 目标的说明）
      - target: AetherCore
      # AetherCore 运行时要加载的 AetherLib* 动态框架：框架目标不会替 App 把它们嵌进包里，由 App 嵌入。
      # App 自己的代码不调 FFmpeg，链接它们不影响符号绑定
      - package: FFmpegBuild
        product: AetherFFmpegBuild
    info:
      path: MovieClaw/Info.plist
      properties:
        CFBundleDisplayName: MovieClaw
        # 系统界面（画中画、系统菜单、权限弹窗的按钮）跟着说中文，见 options.developmentLanguage
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # App 固定暗色：底色纯黑（同 Apple Music），启动屏与系统弹出的界面也跟着是暗色，不会先白屏一下
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 只用系统 HTTPS（URLSession / AVPlayer），属于出口合规豁免的加密；声明后每次上传
        # App Store Connect 不再逐次追问加密问卷
        ITSAppUsesNonExemptEncryption: false
        # 自托管服务器绝大多数是局域网 http 直连（如 http://192.168.1.10:3000），
        # 必须放开 ATS 才能访问；公网 https 部署不受影响。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MovieClaw 需要访问局域网，用于自动发现并连接你自己部署的 MovieClaw 服务器。
        NSPhotoLibraryUsageDescription: 选择图片作为头像、媒体库封面或 AI 会话附件。
        NSCameraUsageDescription: 拍照作为 AI 会话的图片附件。
        # 后台继续播放音频、画中画
        UIBackgroundModes:
          - audio
    settings:
      base:
        # 前缀默认 io.movieclaw，可在 Signing.local.xcconfig 或 xcodebuild 参数里改，见 XcodeConfig/Signing.xcconfig
        PRODUCT_BUNDLE_IDENTIFIER: $(MC_BUNDLE_ID_PREFIX).app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 首版只上 iPhone（2026-09-28 用户决定）：iPad 布局未验收，声明支持就要交 iPad 截图、
        # 审核也会在 iPad 上测。iPad 上仍可按 iPhone 兼容模式安装运行
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # 自研引擎（AetherEngine）的动态框架边界。
  # 为什么不直接链进 App：这是 LGPL 组件的替换边界（用户可以用自行编译的同名框架替换）；
  # 它的 FFmpeg 引用也在这个框架链接时就绑定到自带的 AetherLib* 框架——一个进程里有两份 FFmpeg 时
  # （2026-09-28 移除 MPV 之前，mpv 还静态打着一份），avcodec_* 绑到哪一份由链接顺序决定，
  # 绑错了症状像引擎 bug（上游文档「One FFmpeg」）。App 只 import AetherCore，不得直接依赖 AetherEngine。
  # iPhone 与 Apple TV 共用同一个框架目标（同一个模块名 AetherCore），两个 App 各自嵌入对应平台的产物
  AetherCore:
    type: framework
    platform: auto
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: AetherCore
        type: syncedFolder
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.movieclaw.aethercore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # LibDovi 的 tvOS 模拟器切片只有 arm64：模拟器只编 arm64（Apple 芯片的 Mac），真机不受影响
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
  # Apple TV 版（docs/design/tvos-app.md）：界面层在 MovieClawTV/，接口层、登录与账号、播放逻辑与 iPhone 版
  # 共用 Shared/；播放引擎同一个 AetherCore。Bundle ID 与 iPhone 版相同（同一条 App Store 记录，一次购买两端通用）
  MovieClawTV:
    type: application
    platform: tvOS
    sources:
      - path: MovieClawTV
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: AetherCore
      # 同 iPhone 版：AetherCore 运行时加载的 AetherLib* 动态框架由 App 嵌入
      - package: FFmpegBuild
        product: AetherFFmpegBuild
    info:
      path: MovieClawTV/Info.plist
      properties:
        CFBundleDisplayName: MovieClaw
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 底色纯黑，与 iPhone 版一致；系统界面（键盘、弹窗）也跟着是暗色
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          - arm64
        # 自托管服务器多是局域网 http 直连，理由同 iPhone 版
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MovieClaw 需要访问局域网，用于自动发现并连接你自己部署的 MovieClaw 服务器。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MC_BUNDLE_ID_PREFIX).app
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        # 同 AetherCore：LibDovi 的 tvOS 模拟器切片只有 arm64
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
  MovieClawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovieClawTests
        type: syncedFolder
    dependencies:
      - target: MovieClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MC_BUNDLE_ID_PREFIX).MovieClawTests
        GENERATE_INFOPLIST_FILE: YES
  MovieClawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MovieClawUITests
        type: syncedFolder
    dependencies:
      - target: MovieClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MC_BUNDLE_ID_PREFIX).MovieClawUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MovieClaw
        # XCTestCase 的初始化器是非隔离的，测试类不能继承工程级的默认主线程隔离
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  MovieClawTV:
    build:
      targets:
        MovieClawTV: all
  MovieClaw:
    build:
      targets:
        MovieClaw: all
        MovieClawTests: [test]
    test:
      targets:
        - MovieClawTests
        - MovieClawUITests
