<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieClaw</title>
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="catalog.css">
</head>
<body>
  <!-- 窗口标题栏 -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar-title">MovieClaw</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btnMinimize" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5.5" width="12" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btnMaximize" title="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button class="titlebar-btn titlebar-close" id="btnClose" title="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- 侧栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-toolbar">
        <button type="button" id="btnToggleSidebar" class="sidebar-tool" aria-label="收起侧边栏" title="收起侧边栏" aria-expanded="true" aria-controls="sidebar">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-11-3 3 3 3"/></svg>
        </button>
        <button type="button" id="btnSidebarSearch" class="sidebar-tool sidebar-search-button" aria-label="搜索" title="搜索 (Ctrl+F)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
        </button>
      </div>
      <div class="sidebar-search">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="搜索片名、演员、导演" id="searchInput" aria-label="搜索片名、演员、导演" autocomplete="off">
      </div>

      <div class="sidebar-nav">
        <div class="nav-section">
          <a class="nav-item active" data-page="home" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>
            <span>首页</span>
          </a>
          <a class="nav-item" data-page="favorites" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            <span>我的收藏</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">媒体库</div>
          <div id="libraryNav">
            <!-- 动态填充 -->
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">合集</div>
          <div id="collectionNav">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div id="catalogNav" class="catalog-nav" hidden aria-label="可选页面入口"></div>
        <button id="accountButton" class="account-button" aria-haspopup="dialog">账号 ▾</button>
        <a class="nav-item" data-page="settings" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>设置</span>
        </a>
      </div>
    </nav>

    <!-- 内容区 -->
    <main class="content" id="content">
      <!-- 页面内容动态加载 -->
      <div class="page-loading">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- 内置播放器 -->
  <div class="player-view" id="playerView" hidden>
    <div class="player-video-wrap">
      <video id="playerVideo" preload="auto"></video>
    </div>
    <!-- 加载状态 -->
    <div class="player-loading" id="playerLoading">
      <div class="spinner"></div>
      <div class="player-loading-text" id="playerLoadingText">正在加载...</div>
    </div>
    <!-- 顶部栏 -->
    <div class="player-topbar" id="playerTopbar">
      <button class="player-back" id="playerBack">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="player-title" id="playerTitle" data-tauri-drag-region></div>
    </div>
    <!-- 中央播放按钮 -->
    <button class="player-center-btn" id="playerCenterBtn" aria-label="播放或暂停">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <!-- 实时速度徽标：独立于控制栏显隐（控制条淡出时也要能看速度），点击打开诊断面板 -->
    <button id="playerSpeedBadge" class="player-speed-badge" hidden title="实时下载速度，点击查看播放信息">↓ —</button>
    <!-- 播放诊断面板（右键切换）：源 → 处理 两层，信息层次对标 Emby（web 端 diagnostics-panel 同款） -->
    <div class="player-info-panel" id="playerInfoPanel" hidden>
      <div class="player-info-head">
        <span>播放信息</span>
        <button id="playerInfoClose" class="player-info-close" aria-label="关闭播放信息">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="player-info-body" id="playerInfoBody"></div>
      <div class="player-info-reason" id="playerInfoReason"></div>
    </div>
    <!-- 底部控制条：居中玻璃双行面板（同 macOS MacPlayerTransport：宽 ≤720、高 100、距底 24、圆角 22）
         上行两侧等宽，播放键永远在正中：音量 | 上一集·后退·播放·前进·下一集 | 设置·画中画·全屏
         下行「已播 — 进度条 — 剩余/总长」，点右侧时间在剩余与总长间切换（同 QuickTime） -->
    <div class="player-controls" id="playerControls">
      <div class="player-transport">
        <div class="player-transport-top">
          <div class="player-transport-side">
            <div class="player-volume-group">
              <button class="player-ctrl-btn" id="btnMute" title="静音 (M)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="iconVol"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="iconMute" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <input type="range" class="player-volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="音量" title="音量 (↑ / ↓)">
              <span class="player-volume-value" id="playerVolumeValue">100%</span>
            </div>
          </div>
          <div class="player-transport-center">
            <button class="player-ctrl-btn" id="btnPrevEp" title="上一集 (Ctrl+←)" hidden>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.5" height="14" rx="1"/><polygon points="19 5 19 19 9 12 19 5"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnRew" title="后退 10 秒 (←)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="player-ctrl-btn player-play-btn" id="btnPlayPause" title="播放/暂停 (空格)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="iconPlay"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="iconPause" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnFwd" title="前进 10 秒 (→)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnNextEp" title="下一集 (Ctrl+→)" hidden>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 5 5 19 15 12 5 5"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg>
            </button>
          </div>
          <div class="player-transport-side player-transport-side-right">
            <button class="player-ctrl-btn" id="btnPlayerInfo" aria-label="播放信息" aria-expanded="false" aria-controls="playerInfoPanel" title="播放信息 (I)">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnSpeed" title="倍速">
              <span class="player-speed-label" id="speedLabel">1x</span>
            </button>
            <button class="player-ctrl-btn" id="btnSettings" title="字幕 · 音轨 · 画质 · 速度 · 画幅">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnPip" title="画中画">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></svg>
            </button>
            <button class="player-ctrl-btn" id="btnFullscreen" title="全屏 (F)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="player-transport-bottom">
          <span class="player-time" id="playerTime">0:00</span>
          <div class="player-seek" id="playerSeek">
            <div class="player-seek-buffer" id="playerSeekBuffer"></div>
            <div class="player-seek-fill" id="playerSeekFill"></div>
            <div class="player-seek-thumb" id="playerSeekThumb"></div>
          </div>
          <!-- 点一下在「剩余」与「总长」间切换（同 QuickTime / macOS mac-player-remaining） -->
          <button class="player-time player-remaining" id="playerRemaining" title="显示总时长">0:00</button>
        </div>
      </div>
    </div>
    <!-- 设置面板 -->
    <div class="player-settings-panel" id="playerSettingsPanel" hidden>
      <div class="player-settings-tabs">
        <button class="player-settings-tab active" data-tab="subtitles">字幕</button>
        <button class="player-settings-tab" data-tab="audio">音轨</button>
        <button class="player-settings-tab" data-tab="quality">画质</button>
        <button class="player-settings-tab" data-tab="speed">速度</button>
        <button class="player-settings-tab" data-tab="frame">画幅</button>
      </div>
      <div class="player-settings-content" id="playerSettingsContent">
        <!-- 动态填充 -->
      </div>
    </div>
    <!-- 倍速面板 -->
    <div class="player-speed-panel" id="playerSpeedPanel" hidden>
      <div class="player-speed-option" data-speed="0.5">0.5x</div>
      <div class="player-speed-option" data-speed="0.75">0.75x</div>
      <div class="player-speed-option active" data-speed="1">1x</div>
      <div class="player-speed-option" data-speed="1.25">1.25x</div>
      <div class="player-speed-option" data-speed="1.5">1.5x</div>
      <div class="player-speed-option" data-speed="2">2x</div>
    </div>
    <!-- 跳过片头/片尾按钮 -->
    <button class="player-skip-btn" id="playerSkipBtn" hidden>跳过片头</button>
  </div>

  <script src="hls.min.js"></script>
  <script src="jassub.umd.js"></script>
  <script src="icons.js"></script>
  <script src="shell.js"></script>
  <script src="performance.js"></script>
  <script src="api.js"></script>
  <script src="qrcodegen.js"></script>
  <script src="player.js"></script>
  <script src="platform.js"></script>
  <script src="subtitles.js"></script>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
