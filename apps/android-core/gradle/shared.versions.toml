# apps/android-core 共用模块的依赖版本唯一来源（TV 与手机两个工程都在 settings 里以 `shared` 导入）。
# 两个 App 自己也用到的同名库（Media3、OkHttp、协程、序列化）一律从这里取，不在各自的 libs 里另写版本。
[versions]
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
media3 = "1.11.1"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# 手机的老测试还在用 JUnit 4 版的 okhttp3.mockwebserver 包
okhttp-mockwebserver-legacy = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# ASS 特效字幕（libass 的 Media3 接入，MIT；libass 本身 ISC）。0.5.x 对着 Media3 1.8 编，升级 Media3 时一起验
ass-media = { module = "io.github.peerless2012:ass-media", version = "0.5.1" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
checker-qual = { module = "org.checkerframework:checker-qual", version = "3.49.3" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
