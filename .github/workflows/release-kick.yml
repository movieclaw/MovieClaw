# =============================================================================
# 发版点火（远程会话的 tag 通道）
#
# 远程会话（Claude Code 等）的 git 凭证只能推分支：推不了 tag，也没有
# workflow_dispatch 的 API 权限——release.yml 的两个入口都够不着，发版
# 最后一步只能等人到 Actions 页面手点。本工作流补上这条通道：
#
#   推送 release-kick/vX.Y.Z 分支（内容随意，通常就是 main 的快照）
#     → 校验版本号格式并与 main 的 pyproject 比对
#     → 以 GITHUB_TOKEN 调 release.yml 的 workflow_dispatch（tag=vX.Y.Z）
#     → 删除点火分支（一次性信使，用完即焚）
#   独立客户端同理：release-kick/android-vX.Y.Z、release-kick/androidtv-vX.Y.Z 与 main 上
#   对应 version.properties 比对后触发 android-release.yml；release-kick/ios-v、tvos-v、
#   macos-v 与 apps/apple/project.yml 的 MARKETING_VERSION、release-kick/transcoder-v 与
#   转码器 Info.plist 的版本比对后触发 apple-release.yml；release-kick/windows-v 与
#   apps/desktop/src-tauri/Cargo.toml 的版本比对后触发 windows-release.yml。
#
# 为什么不递归：GITHUB_TOKEN 触发的事件默认不再引发新工作流（防递归），
# 但 workflow_dispatch / repository_dispatch 是官方明确的例外——正好是
# 我们需要的那一个。release.yml 的手动通道会在 main HEAD 上创建 tag，
# 之后构建、Release、Docker 镜像全部照常。
#
# 权限说明：能推分支的人本来就能推 tag（本地环境），此通道不扩大权限面。
# =============================================================================
name: release-kick

on:
  push:
    branches:
      - "release-kick/v*"
      - "release-kick/android-v*"
      - "release-kick/androidtv-v*"
      - "release-kick/ios-v*"
      - "release-kick/tvos-v*"
      - "release-kick/macos-v*"
      - "release-kick/transcoder-v*"
      - "release-kick/windows-v*"

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 校验 tag 并触发 release 工作流
        run: |
          TAG="${GITHUB_REF_NAME#release-kick/}"
          case "$TAG" in
            android-v*|androidtv-v*|ios-v*|tvos-v*|macos-v*|transcoder-v*|windows-v*)
              case "$TAG" in
                android-v*) FILE=apps/android/version.properties; WORKFLOW=android-release.yml ;;
                androidtv-v*) FILE=apps/android-tv/version.properties; WORKFLOW=android-release.yml ;;
                transcoder-v*) FILE=macos/MovieClawTranscoder/Resources/Info.plist; WORKFLOW=apple-release.yml ;;
                windows-v*) FILE=apps/desktop/src-tauri/Cargo.toml; WORKFLOW=windows-release.yml ;;
                *) FILE=apps/apple/project.yml; WORKFLOW=apple-release.yml ;;
              esac
              VERSION="${TAG#*-v}"
              if [ "${FILE##*.}" = plist ]; then
                ACTUAL=$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["CFBundleShortVersionString"])' "$FILE")
              else
                ACTUAL=$(sed -n -e 's/^versionName=//p' -e 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' \
                  -e 's/^version = "\([^"]*\)"/\1/p' "$FILE" | head -1)
              fi
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || [ "$VERSION" != "$ACTUAL" ]; then
                echo "::error::tag $TAG 与 main 上 $FILE 的版本 $ACTUAL 不一致"
                exit 1
              fi
              echo "触发 $WORKFLOW（tag=$TAG，将在 main HEAD 上创建 tag）"
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
              exit 0
              ;;
          esac
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::点火分支名里的 tag 段不合法：$TAG（应形如 v0.4.0）"
            exit 1
          fi
          # 与 main 的 pyproject 版本比对，拦下「点火分支写错版本号」：
          # release.yml 的构建脚本也会强校验，这里提前失败、报错更直白
          PY_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          BARE="${TAG#v}"; BARE="${BARE%%-*}"
          if [ "$BARE" != "$PY_VERSION" ]; then
            echo "::error::tag $TAG 与 main 上 pyproject 的 version=$PY_VERSION 不一致"
            exit 1
          fi
          echo "触发 release.yml（tag=$TAG，将在 main HEAD 上创建 tag）"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

      - name: 删除点火分支
        if: always()
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" \
            && echo "点火分支已清理" || echo "::warning::点火分支删除失败，可手动删除 $GITHUB_REF_NAME"
