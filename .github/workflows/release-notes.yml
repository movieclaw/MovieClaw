# =============================================================================
# Release changelog 同步
#
# docs/changelog/vX.Y.Z.md 与 torrent-ner-vN.md 是应用和模型日志的事实源。
# 每份文件包含英文正文与完整中文说明（进版本管理、可评审）。
# 该目录有文件合入 main 时，本工作流把每份 changelog 同步为同名 tag 的
# GitHub Release body——应用内更新界面会原文展示这段文字。
#
# 为什么走「文件 + 同步」而不是手工编辑 Release：
#   - changelog 随代码走 PR 评审，不再是发布后补写的口头产物；
#   - 远程会话（Claude Code 等）没有编辑 Release 的 API 权限，但能合 PR，
#     借这条通道即可完成 changelog 的全流程自动化。
#
# 对应 Release 尚不存在的文件（例如提前合入下个版本的 changelog）会被
# 跳过，等 Release 创建后再次触碰该文件即可同步。
#
# 同步正文后重新生成该版本的 release.json（scripts/publish-release-info.sh），
# 官网更新日志读的是这份按语言拆好的清单。
# =============================================================================
name: release-notes

on:
  push:
    branches: [main]
    paths: ["docs/changelog/*.md"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.json 要和上一个 tag 比较运行时版本，需要完整历史与 tag
          fetch-depth: 0

      - name: 同步 changelog 到对应 Release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for file in docs/changelog/v*.md docs/changelog/torrent-ner-v*.md; do
            tag="$(basename "$file" .md)"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "同步 $file → Release $tag"
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$file"
              case "$tag" in v*) bash scripts/publish-release-info.sh "$tag" ;; esac
            else
              echo "跳过 $file：Release $tag 尚不存在"
            fi
          done
