# =============================================================================
# Mac 版 App 发版流水线（docs/design/macos-app.md）
#
# Mac 版 App 不再随服务器 vX.Y.Z Release 分发，而是单独发 macos-vX.Y.Z：
# 附件 MovieClaw-macos-arm64.zip（Developer ID 签名并公证）与 downloads.json（官网下载页读取）。
# tag 版本必须等于 apps/apple/project.yml 的 MARKETING_VERSION（iPhone / Apple TV 共用）；
# 这个版本已经发过 Mac 时，先递增 MARKETING_VERSION 再发。
#
# 与 android-release.yml 一样两段式（draft → publish），始终 --latest=false：
# latest 只能是服务器版本。失败时 Release 停在 draft，修复后重跑本工作流即可。
# =============================================================================
name: mac-release

concurrency:
  group: mac-release-${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["macos-v*"]
  # 远程会话推不了 tag：走 release-kick 点火分支，或到 Actions 手动输入 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（macos-vX.Y.Z），须与 project.yml 的 MARKETING_VERSION 一致"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 核对版本号并创建 draft Release
        run: |
          version="${RELEASE_TAG#macos-v}"
          if [ "$version" = "$RELEASE_TAG" ] || ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 macos-vX.Y.Z：$RELEASE_TAG"
            exit 1
          fi
          actual="$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' apps/apple/project.yml | head -1)"
          if [ "$version" != "$actual" ]; then
            echo "::error::tag $RELEASE_TAG 与 apps/apple/project.yml 的 MARKETING_VERSION=$actual 不一致"
            exit 1
          fi
          NOTES_ARGS=(--generate-notes)
          if [ -f "docs/changelog/$RELEASE_TAG.md" ]; then
            NOTES_ARGS=(--notes-file "docs/changelog/$RELEASE_TAG.md")
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --latest=false \
              --title "MovieClaw for Mac $version" "${NOTES_ARGS[@]}"
          elif [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            # 同 release.yml：上一轮失败留下的 draft 还锁着旧提交，校正到本轮
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            echo "::error::$RELEASE_TAG 已发布；发新版请先递增 MARKETING_VERSION 再打新 tag"
            exit 1
          fi

  # 打包、签名、公证都在 apps/apple/scripts/package-mac-app.sh（本机手工发版同用）。
  # 没配证书（如 fork 出去的仓库）时 ad-hoc 签名，照常产出，只是别人下载后首次打开会被系统拦下。
  mac-app:
    needs: prepare
    # 与 App PR 检查一致：Xcode 27
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      # 证书导入临时钥匙串，作业结束即删
      - name: 准备 Developer ID 签名与公证凭证
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::未配置 MACOS_DEVELOPER_ID_P12，Mac 版沿用 ad-hoc 签名（用户首次打开会被系统拦下）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12 里没有「Developer ID Application」证书（导出的是不是 Apple Development / Distribution？）"
            exit 1
          fi
          echo "MOVIECLAW_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            {
              echo "MOVIECLAW_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
              echo "MOVIECLAW_NOTARY_KEY_ID=$API_KEY_ID"
              echo "MOVIECLAW_NOTARY_ISSUER=$API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::已配置签名证书但未配置 APPLE_API_KEY_P8，Mac 版不会公证（用户首次打开仍会被系统拦下）"
          fi

      - name: 编译、签名、公证并打包
        run: apps/apple/scripts/package-mac-app.sh

      - name: 清理签名钥匙串与密钥
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/apple/build-macapp/MovieClaw-macos-arm64.zip

  publish:
    needs: mac-app
    # 官网清单从实际 ZIP 读取，macOS runner 还能复核签名和公证
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 脚本校验包与 tag 是同一个产品、同一个版本
      - name: 生成官网下载清单
        run: bash scripts/publish-download-manifest.sh "$RELEASE_TAG"

      - name: 发布 Release（不标 latest）
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
