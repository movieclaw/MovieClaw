# =============================================================================
# 发版流水线（docs/design/in-app-update.md M1）
#
# 打 v* tag 时构建全部发版产物并发布 GitHub Release：
#   - 应用更新三件套：app-web.tar.gz / app-backend.tar.gz / manifest.json
#   - mclaw CLI 六平台归档 + checksums.txt（goreleaser 构建）
#   - macOS 远程转码 Worker（MovieClawTranscoder-macos-arm64.zip）：
#     此前这个 App 只能由用户自己 clone 仓库 + 装 Xcode + swift build，对一个
#     面向 NAS 用户的开源项目来说等同于劝退。
#   - iOS 未签名 IPA（MovieClaw-iOS-unsigned.ipa）：给不走 App Store / TestFlight 的
#     用户用 AltStore / SideStore / Sideloadly 以自己的 Apple ID 重签后侧载。
#   - Mac 版 App（MovieClaw-macos-arm64.zip）：与转码器同一套 Developer ID 签名与公证，
#     下载解压后双击即可打开。
#   - Android 正式签名 APK（MovieClaw-Android-arm64.apk）与包内版本元数据：
#     版本独立于服务器/Apple；有改动才重编，否则沿用旧包。缺失时拦截 Release 转正。
#   - Android TV 正式签名 APK（MovieClaw-AndroidTV.apk）与元数据：独立 App 与版本，与手机版
#     共用同一把签名密钥；同样按改动重编或沿用，目前是可选附件（缺了只告警）。
#   Worker / IPA / Mac App 是可选附件：自上一版以来对应代码没变时不重编，
#   直接沿用上一个 Release 里的同名文件（asset-plan / carry-assets 作业）。
# 产物上传成功后自动调用 docker-image.yml，同步发布同版本号的
# Docker 镜像（多架构，标签策略见该工作流头注释）。
#
# 发布是两段式的（draft → publish）：Release 先以 draft 创建，各作业往
# draft 上传产物，最后 publish 作业校验产物齐全、镜像发布成功后才转正。
# 为什么：Release 一旦可见，应用内更新检查器和 install-cli.sh 的
# latest/download 立刻会读它——产物陆续上传的窗口期里，用户会撞上
# 「latest 里没有 mclaw」的 404，或在应用内看到 --generate-notes 的 PR
# 清单。draft 对两者都不可见（app_update.py 也显式过滤 draft），产物
# 齐全前用户永远看不到半成品 Release。任何作业失败时 Release 停在
# draft，修复后重跑本工作流即可——所有上传都带 --clobber，可安全重入。
# =============================================================================
name: release

# 同一 tag 的发版串行执行，避免重跑/连发时产物与镜像标签交错
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  # 手动触发通道：远程会话（Claude Code 等）的 git 凭证通常只能推分支、
  # 推不了 tag。这里输入目标 tag 后先创建 draft Release（--target 指向
  # 触发时的 main HEAD），publish 作业转正时才真正创建 tag。GITHUB_TOKEN
  # 创建的 tag 不会再触发本工作流的 push 事件，无递归风险。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.2.0），须与 pyproject / __version__ 一致"
        required: true
      force_rebuild:
        description: "客户端附件（Mac 转码器、iOS IPA、Mac App、Android APK）全部重编"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    env:
      # tag 推送事件取 ref 名；手动触发取输入的 tag。后续步骤统一用它。
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装后端运行依赖（spec 导出需要拉起 FastAPI app）
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; open('requirements.txt', 'w').write('\n'.join(deps))"
          pip install --no-cache-dir -r requirements.txt

      - name: 构建更新产物（版本取自 tag，与 pyproject/__version__ 三方校验）
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # 配置了 RELEASE_SIGNING_KEY 机密（Ed25519 私钥 PEM）时自动生成
          # manifest.json.sig；未配置则跳过签名（部署侧不设公钥即不校验）
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          VERSION="${RELEASE_TAG#v}" ./scripts/build-release-artifacts.sh dist/release

      - name: 上传 Release assets（Release 不存在则创建 draft）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 带预发布段的 tag（v0.2.0-beta 等）自动标记 GitHub prerelease：
          # 应用内更新的检查逻辑会跳过 prerelease，避免 beta 被推给全量用户
          PRERELEASE_FLAG=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # Release body 优先取已合入的 changelog 文件——应用内更新界面会
          # 原文展示 body，不该让用户看到 --generate-notes 的 PR 清单。
          # changelog 后合入的情况仍由 release-notes.yml 兜底同步。
          NOTES_ARGS=(--generate-notes)
          if [ -f "docs/changelog/$RELEASE_TAG.md" ]; then
            NOTES_ARGS=(--notes-file "docs/changelog/$RELEASE_TAG.md")
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # --draft：产物齐全前 Release 不可见，由 publish 作业最终转正。
            # --target：手动触发通道里 tag 尚不存在，draft 转正时会在该提交
            # 上创建 tag；tag 推送事件里 tag 已存在，此参数被忽略
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft \
              --title "$RELEASE_TAG" "${NOTES_ARGS[@]}" $PRERELEASE_FLAG
          else
            # 已存在的 draft 通常是上一轮失败留下的，它还锁着那一轮的
            # target_commitish——转正时 tag 会创建在那个旧提交上，与本轮真正
            # 构建、打包、做镜像的代码对不上（v0.19.0 就这么踩过：产物是 main
            # HEAD 的，tag 却停在几小时前的发版提交）。重跑时把 target 校正到
            # 本轮的 SHA，让 tag 落在被发布的那棵树上。
            #
            # 只对仍是 draft 的 Release 动手：已转正的 Release 不该被重跑改写。
            # tag 推送通道里 tag 本就存在，target 不参与 tag 创建，改不改无所谓，
            # 这里按 isDraft 判定即可，不必再分通道。
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                      --json isDraft --jq .isDraft)" = "true" ]; then
              echo "draft Release 已存在，把 target 校正为本轮的 $GITHUB_SHA"
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA"
            fi
          fi
          assets=(dist/release/app-web.tar.gz dist/release/app-backend.tar.gz dist/release/manifest.json)
          [ -f dist/release/manifest.json.sig ] && assets+=(dist/release/manifest.json.sig)
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

  # mclaw CLI（Go）。needs 只为等 draft Release 被创建出来，与 docker-image
  # 并行。CLI 是 Agent 操作产品的唯一入口，install-cli.sh 也直接来这里取
  # 产物——缺了它 publish 作业不会让 Release 转正，该红就红。
  cli:
    needs: release-artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端运行依赖（内嵌 spec 现场导出需要拉起 FastAPI app）
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; open('requirements.txt', 'w').write('\n'.join(deps))"
          pip install --no-cache-dir -r requirements.txt

      # 内嵌基线 spec 是构建产物不入 git，这里显式导出一次（goreleaser 的
      # before hook 还会再导一次，两次结果相同）：导出失败在这一步就以清楚的
      # Python 报错暴露，而不是埋在 goreleaser 的 hook 输出里。
      - name: 导出内嵌基线 spec
        run: scripts/export-spec.sh

      # 手动触发通道里 tag 要等 draft 转正才真正创建，checkout 里没有它。
      # goreleaser 不只是「校验」tag，它还要读 tag 的内容（annotation）来填
      # 发布元数据：--skip=validate 关不掉这一步。2.18.0 读不到时只是警告
      # 「couldn't find any tags before ...」后继续，2.18.1 起改成硬失败
      # （couldn't get tag contents: unexpected git tag output for "vX.Y.Z": ""），
      # v0.22.0 的发版就是这么红的——version: "~> v2" 是浮动的，同一份工作流
      # 换个月跑就换了行为。这里补一个只存在于 runner 本地、绝不推送的
      # annotated tag，让两条通道对 goreleaser 呈现同一个 git 状态：不再依赖
      # goreleaser 对「tag 不存在」的容忍度。tag 推送通道里 tag 已存在，
      # 这步自然跳过。
      - name: 补一个本地 tag（手动触发通道里 tag 尚未创建）
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
            echo "tag $RELEASE_TAG 已存在（tag 推送通道），无需补"
          else
            echo "在 $GITHUB_SHA 上补本地 tag $RELEASE_TAG（不推送）"
            git -c user.email=actions@github.com -c user.name=github-actions \
              tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$GITHUB_SHA"
          fi

      - name: 构建六平台产物
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          workdir: cli
          # --skip=validate：手动触发通道里 HEAD 与 tag 的关系不满足 goreleaser
          # 的期待，脏区与版本一致性已由上一步和 build-release-artifacts.sh
          # 显式把关。上传不走 goreleaser（GitHub API 按 tag 查不到 draft，
          # goreleaser 会另建一个 Release），由下一步用 gh 上传——gh 能按
          # tag 名找到草稿。
          args: release --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            cli/dist/mclaw_*.tar.gz cli/dist/mclaw_*.zip cli/dist/checksums.txt

  # 客户端附件这次重编还是沿用上一版，判断规则见脚本头注释。
  # 单独一个 ubuntu 作业先判断，沿用时 macOS runner 一台都不用起。
  asset-plan:
    needs: release-artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET_SHA: ${{ github.sha }}
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      worker_mode: ${{ steps.plan.outputs.worker_mode }}
      worker_from: ${{ steps.plan.outputs.worker_from }}
      ipa_mode: ${{ steps.plan.outputs.ipa_mode }}
      ipa_from: ${{ steps.plan.outputs.ipa_from }}
      mac_mode: ${{ steps.plan.outputs.mac_mode }}
      mac_from: ${{ steps.plan.outputs.mac_from }}
      android_mode: ${{ steps.plan.outputs.android_mode }}
      android_from: ${{ steps.plan.outputs.android_from }}
      tv_mode: ${{ steps.plan.outputs.tv_mode }}
      tv_from: ${{ steps.plan.outputs.tv_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # 要拿上一个 tag 做 diff，需要完整历史与 tag
          fetch-depth: 0

      - id: plan
        name: 按改动判断
        run: |
          scripts/release-asset-plan.sh MovieClawTranscoder-macos-arm64.zip \
            macos/MovieClawTranscoder | sed 's/^/worker_/' >> "$GITHUB_OUTPUT"
          # iPhone 版用到的是 apps/apple 下除 Apple TV 专属目录与测试以外的全部
          # （Shared/、AetherCore、Vendor、project.yml 等与 TV 共用，改了也要重编）
          scripts/release-asset-plan.sh MovieClaw-iOS-unsigned.ipa \
            apps/apple \
            ':(exclude)apps/apple/MovieClawTV' \
            ':(exclude)apps/apple/MovieClawTVTopShelf' \
            ':(exclude)apps/apple/MovieClawTVUITests' \
            ':(exclude)apps/apple/MovieClawTests' \
            ':(exclude)apps/apple/MovieClawUITests' | sed 's/^/ipa_/' >> "$GITHUB_OUTPUT"
          # Mac 版用到的是 apps/apple 下除 iPhone、Apple TV 专属目录与测试以外的全部
          # （目录名带斜杠：只排除 MovieClaw/ 本身，不连带 MovieClawMac/）
          scripts/release-asset-plan.sh MovieClaw-macos-arm64.zip \
            apps/apple \
            ':(exclude)apps/apple/MovieClaw/' \
            ':(exclude)apps/apple/MovieClawNotificationService/' \
            ':(exclude)apps/apple/MovieClawTV/' \
            ':(exclude)apps/apple/MovieClawTVTopShelf/' \
            ':(exclude)apps/apple/MovieClawTVUITests/' \
            ':(exclude)apps/apple/MovieClawTests/' \
            ':(exclude)apps/apple/MovieClawUITests/' \
            ':(exclude)apps/apple/MovieClawMacTests/' | sed 's/^/mac_/' >> "$GITHUB_OUTPUT"
          scripts/release-asset-plan.sh MovieClaw-Android-arm64.apk \
            apps/android .github/workflows/release.yml | sed 's/^/android_/' >> "$GITHUB_OUTPUT"
          scripts/release-asset-plan.sh MovieClaw-AndroidTV.apk \
            apps/android-tv .github/workflows/release.yml | sed 's/^/tv_/' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Android 是必需附件：每次正式 Release 都有可安装的 APK 和固定下载地址。
  # 沿用单独放在本作业内，其他可选附件复制失败不会影响 Android 的结果判定。
  android-apk:
    needs: asset-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ANDROID_MODE: ${{ needs.asset-plan.outputs.android_mode }}
      ANDROID_FROM: ${{ needs.asset-plan.outputs.android_from }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: env.ANDROID_MODE == 'build'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.ANDROID_MODE == 'build'

      - name: 构建正式签名 Android APK
        if: env.ANDROID_MODE == 'build'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?未配置 Android 正式签名密钥}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/movieclaw-android.p12"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash apps/android/scripts/package-release.sh

      - name: 沿用上一版 Android APK 和实际版本信息
        if: env.ANDROID_MODE == 'carry'
        run: |
          mkdir -p apps/android/build/release
          gh release download "$ANDROID_FROM" --repo "$GITHUB_REPOSITORY" \
            --pattern 'MovieClaw-Android-arm64.apk' --pattern 'MovieClaw-Android-arm64.json' \
            --dir apps/android/build/release

      - name: 验证并上传 Android 附件
        run: |
          python3 scripts/build-download-manifest.py --tag "$RELEASE_TAG" \
            --directory apps/android/build/release
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/android/build/release/MovieClaw-Android-arm64.apk \
            apps/android/build/release/MovieClaw-Android-arm64.json
          echo "Android APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/MovieClaw-Android-arm64.apk" >> "$GITHUB_STEP_SUMMARY"

  # Android TV（apps/android-tv）：独立 App 与版本号（version.properties），签名复用手机版的
  # ANDROID_KEYSTORE_* 密钥。正式包必须带 FFmpeg 音频软解（两种 ARM 架构），由打包脚本现编。
  # 目前是可选附件：失败不拦转正，publish 只告警。
  android-tv-apk:
    needs: asset-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TV_MODE: ${{ needs.asset-plan.outputs.tv_mode }}
      TV_FROM: ${{ needs.asset-plan.outputs.tv_from }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: env.TV_MODE == 'build'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: env.TV_MODE == 'build'

      - name: 构建正式签名 Android TV APK
        if: env.TV_MODE == 'build'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?未配置 Android 正式签名密钥}"
          # FFmpeg 音频解码库要 NDK 编；CMake 编 JNI 胶水层
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/movieclaw-android-tv.p12"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash apps/android-tv/scripts/package-release.sh

      - name: 沿用上一版 Android TV APK 和实际版本信息
        if: env.TV_MODE == 'carry'
        run: |
          mkdir -p apps/android-tv/build/release
          gh release download "$TV_FROM" --repo "$GITHUB_REPOSITORY" \
            --pattern 'MovieClaw-AndroidTV.apk' --pattern 'MovieClaw-AndroidTV.json' \
            --dir apps/android-tv/build/release

      - name: 验证并上传 Android TV 附件
        run: |
          python3 scripts/build-download-manifest.py --tag "$RELEASE_TAG" \
            --directory apps/android-tv/build/release
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/android-tv/build/release/MovieClaw-AndroidTV.apk \
            apps/android-tv/build/release/MovieClaw-AndroidTV.json
          echo "Android TV APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/MovieClaw-AndroidTV.apk" >> "$GITHUB_STEP_SUMMARY"

  # 沿用上一版的附件：从上一个 Release 下载同名文件，原样传到本次 Release。
  carry-assets:
    needs: asset-plan
    if: ${{ needs.asset-plan.outputs.worker_mode == 'carry' || needs.asset-plan.outputs.ipa_mode == 'carry' || needs.asset-plan.outputs.mac_mode == 'carry' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      WORKER_MODE: ${{ needs.asset-plan.outputs.worker_mode }}
      WORKER_FROM: ${{ needs.asset-plan.outputs.worker_from }}
      IPA_MODE: ${{ needs.asset-plan.outputs.ipa_mode }}
      IPA_FROM: ${{ needs.asset-plan.outputs.ipa_from }}
      MAC_MODE: ${{ needs.asset-plan.outputs.mac_mode }}
      MAC_FROM: ${{ needs.asset-plan.outputs.mac_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 复制附件
        run: |
          carry() {
            echo "从 $2 沿用 $1"
            gh release download "$2" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir carried
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "carried/$1"
          }
          if [ "$WORKER_MODE" = carry ]; then carry MovieClawTranscoder-macos-arm64.zip "$WORKER_FROM"; fi
          if [ "$IPA_MODE" = carry ]; then carry MovieClaw-iOS-unsigned.ipa "$IPA_FROM"; fi
          if [ "$MAC_MODE" = carry ]; then carry MovieClaw-macos-arm64.zip "$MAC_FROM"; fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ]; then
            bash scripts/publish-download-manifest.sh "$RELEASE_TAG"
          fi

  # macOS 远程转码 Worker（自上一版以来有改动才编，否则由 carry-assets 沿用）。
  # 与 docker-image 并行。它构建失败不拦发布——publish 作业不看它的结果，
  # Release 里就是少一个可选附件，主更新链路不受影响；但刻意不用
  # continue-on-error：那样失败会藏在绿色 workflow 里没人发现，红出来
  # 才有人去重跑补传。
  worker-macos:
    needs: asset-plan
    if: ${{ needs.asset-plan.outputs.worker_mode == 'build' }}
    # 必须是 Xcode 26 起的工具链：用旧 SDK 构建的 App 在 macOS 26 上不会有液态
    # 玻璃（系统控件的新外观只对用 macOS 26 SDK 链接的 App 生效），代码里的
    # 玻璃组件也会被 `#if compiler(>=6.2)` 整段编译掉。App 最低仍支持 macOS 12。
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发通道里 tag 要等 draft 转正才创建，默认 ref 未必是发版
          # 提交；显式取触发时的提交，保证打包的就是发版那份代码
          ref: ${{ github.sha }}

      - name: 单测
        run: swift test --package-path macos/MovieClawTranscoder

      # Developer ID 签名 + Apple 公证，用户下载后双击即可打开。所需仓库密钥：
      #   MACOS_DEVELOPER_ID_P12           「Developer ID Application」证书连私钥导出的 .p12，base64 编码
      #   MACOS_DEVELOPER_ID_P12_PASSWORD  导出 .p12 时设的密码
      #   APPLE_API_KEY_P8                 App Store Connect API 密钥 .p8 的文件内容（公证用）
      #   APPLE_API_KEY_ID / APPLE_API_ISSUER_ID  该密钥的 ID 与 Issuer ID
      # 没配证书（例如 fork 出去的仓库）时照旧 ad-hoc 签名，发版不受影响。
      # 证书导入临时钥匙串，作业结束即删；密钥只落在 runner 的临时目录。
      - name: 准备 Developer ID 签名与公证凭证
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::未配置 MACOS_DEVELOPER_ID_P12，转码器沿用 ad-hoc 签名（用户首次打开会被系统拦下）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # 允许 codesign 无交互地使用私钥（CI 里没人点「允许」）
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12 里没有「Developer ID Application」证书（导出的是不是 Apple Development / Distribution？）"
            exit 1
          fi
          echo "MOVIECLAW_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            {
              echo "MOVIECLAW_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
              echo "MOVIECLAW_NOTARY_KEY_ID=$API_KEY_ID"
              echo "MOVIECLAW_NOTARY_ISSUER=$API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::已配置签名证书但未配置 APPLE_API_KEY_P8，转码器不会公证（用户首次打开仍会被系统拦下）"
          fi

      - name: 打包 App（有证书时 Developer ID 签名并公证，版本号注入自发版 tag）
        run: |
          chmod +x macos/MovieClawTranscoder/scripts/package-app.sh
          MOVIECLAW_WORKER_VERSION="${RELEASE_TAG#v}" \
            macos/MovieClawTranscoder/scripts/package-app.sh

      - name: 清理签名钥匙串与密钥
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: 压缩 App Bundle
        run: |
          # 必须用 ditto 而不是 zip：App Bundle 里有符号链接和扩展属性，
          # 普通 zip 解开后可能无法启动
          ditto -c -k --keepParent \
            "macos/MovieClawTranscoder/dist/MovieClaw 转码器.app" \
            "MovieClawTranscoder-macos-arm64.zip"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            MovieClawTranscoder-macos-arm64.zip
          # 只重跑此作业补传公开版本时，也刷新官网信息；draft 的终审统一生成。
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ]; then
            bash scripts/publish-download-manifest.sh "$RELEASE_TAG"
          fi

  # iOS 未签名 IPA（docs/design/ios-release.md「侧载」）：与商店版同一份代码、同一个发行版本，
  # 只是不签名，由用户的侧载工具重签。与 worker-macos 一样是可选附件：失败不拦转正，
  # 重跑本作业即可补传。不需要任何签名密钥，fork 出去的仓库也能照常产出。
  # 同样有改动才编，否则由 carry-assets 沿用。
  ios-ipa:
    needs: asset-plan
    if: ${{ needs.asset-plan.outputs.ipa_mode == 'build' }}
    # 与 App PR 检查及 AetherEngine 上游一致：Xcode 27
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 worker-macos：显式取触发时的提交，保证打包的就是发版那份代码
          ref: ${{ github.sha }}

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: 编译未签名 IPA
        run: apps/apple/scripts/build-unsigned-ipa.sh

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/apple/build-ipa/MovieClaw-iOS-unsigned.ipa

  # Mac 版 App（docs/design/macos-app.md）：与 worker-macos 同一套 Developer ID 签名与公证密钥，
  # 打包、签名、公证都在 apps/apple/scripts/package-mac-app.sh（本机手工发版同用）。
  # 可选附件：失败不拦转正，重跑本作业即可补传；有改动才编，否则由 carry-assets 沿用。
  # 没配证书（如 fork 出去的仓库）时 ad-hoc 签名，照常产出，只是别人下载后首次打开会被系统拦下。
  mac-app:
    needs: asset-plan
    if: ${{ needs.asset-plan.outputs.mac_mode == 'build' }}
    # 与 App PR 检查及 ios-ipa 一致：Xcode 27（Worker 独立保留原工具链）
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 worker-macos：显式取触发时的提交，保证打包的就是发版那份代码
          ref: ${{ github.sha }}

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      # 同 worker-macos 的同名步骤：证书导入临时钥匙串，作业结束即删
      - name: 准备 Developer ID 签名与公证凭证
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::未配置 MACOS_DEVELOPER_ID_P12，Mac 版沿用 ad-hoc 签名（用户首次打开会被系统拦下）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12 里没有「Developer ID Application」证书（导出的是不是 Apple Development / Distribution？）"
            exit 1
          fi
          echo "MOVIECLAW_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            {
              echo "MOVIECLAW_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
              echo "MOVIECLAW_NOTARY_KEY_ID=$API_KEY_ID"
              echo "MOVIECLAW_NOTARY_ISSUER=$API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::已配置签名证书但未配置 APPLE_API_KEY_P8，Mac 版不会公证（用户首次打开仍会被系统拦下）"
          fi

      - name: 编译、签名、公证并打包
        run: apps/apple/scripts/package-mac-app.sh

      - name: 清理签名钥匙串与密钥
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/apple/build-macapp/MovieClaw-macos-arm64.zip
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ]; then
            bash scripts/publish-download-manifest.sh "$RELEASE_TAG"
          fi

  # 产物发布成功后同步发布 Docker 镜像。串在产物之后而非并行，
  # 是为了避免产物构建失败（版本校验不过等）时 latest 镜像已被推走。
  docker-image:
    needs: release-artifacts
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # 终审：产物齐全 + 镜像发布成功后才把 draft Release 转正。
  # 这是发布原子性的落点——转正之前，应用内更新、install-cli.sh 的
  # latest/download、Release 页对用户都不可见，不存在「半成品 Release」。
  # worker-macos / ios-ipa / mac-app / android-tv-apk / carry-assets 失败不拦转正（可选附件），但 cli 或镜像失败时 Release
  # 停在 draft；Android APK 也是必需附件。修复后重跑本工作流即可，全链路可安全重入。
  publish:
    needs: [cli, android-apk, android-tv-apk, worker-macos, ios-ipa, mac-app, carry-assets, docker-image]
    if: ${{ !cancelled() && needs.cli.result == 'success' && needs.android-apk.result == 'success' && needs.docker-image.result == 'success' }}
    # 官网清单从实际 ZIP 读取，macOS runner 还能复核签名和公证。
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # 只用于判断本仓库是否启用了清单签名（启用则 .sig 必须在场）
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成官网的版本与架构清单
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_download_manifest.py'
          bash scripts/publish-download-manifest.sh "$RELEASE_TAG"

      - name: 校验产物齐全并发布 Release
        run: |
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          required="app-web.tar.gz app-backend.tar.gz manifest.json downloads.json
            mclaw_linux_amd64.tar.gz mclaw_linux_arm64.tar.gz
            mclaw_darwin_amd64.tar.gz mclaw_darwin_arm64.tar.gz
            mclaw_windows_amd64.zip mclaw_windows_arm64.zip
            checksums.txt MovieClaw-Android-arm64.apk MovieClaw-Android-arm64.json"
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            required="$required manifest.json.sig"
          fi
          missing=""
          for f in $required; do
            echo "$assets" | grep -qx "$f" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release 产物不齐，拒绝转正（缺少:$missing）。修复对应作业后重跑本工作流即可补传。"
            exit 1
          fi
          if ! echo "$assets" | grep -qx "MovieClawTranscoder-macos-arm64.zip"; then
            echo "::warning::缺少 macOS Worker 附件（可选产物），Release 照常发布；重跑 worker-macos 或 carry-assets 作业可补传"
          fi
          if ! echo "$assets" | grep -qx "MovieClaw-iOS-unsigned.ipa"; then
            echo "::warning::缺少 iOS 未签名 IPA（可选产物），Release 照常发布；重跑 ios-ipa 或 carry-assets 作业可补传"
          fi
          if ! echo "$assets" | grep -qx "MovieClaw-macos-arm64.zip"; then
            echo "::warning::缺少 Mac 版 App（可选产物），Release 照常发布；重跑 mac-app 或 carry-assets 作业可补传"
          fi
          if ! echo "$assets" | grep -qx "MovieClaw-AndroidTV.apk"; then
            echo "::warning::缺少 Android TV APK（可选产物），Release 照常发布；重跑 android-tv-apk 作业可补传"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Release $RELEASE_TAG 已发布"
