# =============================================================================
# 合并门禁 CI（CLAUDE.md「合并前必须通过」四件套的自动化）
#
# 此前 pytest / ruff / web:lint / web:typecheck 全靠本地自觉，外部贡献 PR
# 没有任何机器把关。本工作流把四条门禁固化到 CI：
#
#   - python 作业：ruff check . + pytest（跳过 integration 标记的用例），pytest
#     按文件拆 3 片并行，单用例 180 秒超时（卡死几分钟内失败并打出线程栈）。
#     enrich 的片名/季集抽取依赖 NER 模型（运行期数据，不入 git），缺模型时
#     季集相关的一批测试会稳定失败——所以先从模型 Release 下载三个文件，
#     并用 actions/cache 按 tag 缓存，避免每次跑 CI 都拉 15MB。
#   - web 作业：eslint + tsc，与 release.yml 的前端环境保持同一套版本。
#   - cli-go 作业：mclaw（Go）的 vet、gofmt、单测与六平台交叉编译。命令树
#     快照、豁免端点清单、域帮助覆盖这些命令面守护全在 go test 里，改了路由
#     忘了同步会在这里红。
#   - worker-macos 作业：macOS Worker 的 Swift 构建与单测。它只能在 macOS
#     runner 上编译，本地 Linux 开发机和容器都跑不了，因此这里是它唯一的
#     机器把关。
#
# 按需运行：changes 作业先按 PR 改动的路径算出要跑哪几项，没改到的作业直接
# 跳过（纯文档 PR 以前也要等 8 分钟 pytest）。用作业级 if 而不是工作流级
# paths 过滤：被 if 跳过的作业在 GitHub 上记为 skipped、视同通过，将来给
# main 开分支保护、把它们设为必需检查也不会让 PR 卡在「检查未完成」。
# 两种情况全量跑：改了本文件（门禁自身变了），以及发版 PR（改了
# src/movieclaw_api/__init__.py 的版本号——发版以发版 PR 的 CI 全绿为准）。
# 各作业的路径清单要覆盖它**真正读到的文件**，不只是自己的目录：pytest
# 会读 docker/ 的 entrypoint 与 nginx 模板、web 的路由目录、Worker 的
# Swift 源码、现场编译 cli/；cli-go 要从服务端导出内嵌 spec。新增这类跨目录
# 依赖时记得同步下面的 filters。
#
# 合并进 main 后不再重跑：改动在 PR 上已验过，重跑不挡合并，只会占 runner
# 并发让别的 PR 排队。
# =============================================================================
name: ci

on:
  pull_request:

# 同一个 PR 连推几次时取消旧的运行，只验最新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NER 模型的 Release tag；模型发新版时同步改这里（发版流程见 .claude/skills/release）
env:
  NER_MODEL_TAG: torrent-ner-v3

jobs:
  # 按改动路径决定下面各作业跑不跑。pull_request 事件下 paths-filter 通过
  # GitHub API 取改动文件清单，不需要 checkout。
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      cli-go: ${{ steps.filter.outputs.cli-go }}
      web: ${{ steps.filter.outputs.web }}
      worker-macos: ${{ steps.filter.outputs.worker-macos }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all: &all
              - ".github/workflows/ci.yml"
              - "src/movieclaw_api/__init__.py"
            python:
              - *all
              - "src/**"
              - "tests/**"
              - "alembic/**"
              - "alembic.ini"
              - "pyproject.toml"
              - "Dockerfile"
              - "docker/**"
              - "scripts/**"
              - "cli/**"
              - "apps/web/app/**"
              - "macos/MovieClawTranscoder/Sources/MovieClawTranscoder/ArtifactUploadProxy.swift"
              # ruff check . 检查全仓库的 .py（含 apps/apple/scripts 等目录外脚本），
              # 漏掉它们会让 lint 错误悄悄进 main、卡住之后每一个 Python PR
              - "**/*.py"
            cli-go:
              - *all
              - "cli/**"
              - "src/movieclaw_api/**"
              - "scripts/export-spec.sh"
              - "pyproject.toml"
            web:
              - *all
              - "apps/web/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            worker-macos:
              - *all
              - "macos/**"

  # pytest 拆成 3 片并行（公开仓库的托管 runner 免费），每片内再按 4 核
  # xdist 并行。按文件分配、按历史耗时装箱（tests/conftest.py 的
  # pytest_collection_modifyitems），三片大致同时跑完；某片明显偏慢时用
  # scripts/update-shard-durations.py 刷新 tests/shard-durations.json。
  python:
    name: python (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      # 一片挂了其余照跑完，一次把所有失败都报出来
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 兜底：正常 pytest 几分钟跑完。单用例卡死由 pytest-timeout 拦截，这里管的是
    # 用例之外的卡死（进程退出、插件收尾），避免像以前那样挂到 GitHub 默认的 6 小时
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（含 dev 工具链）
        run: pip install -e ".[dev]"

      # tests/agent 的会话夹具要现场编译 Go 版 mclaw（Agent ↔ CLI 接线验证），
      # 编译需要内嵌的基线 spec（构建产物，不入 git）。以前这里不导出，编译
      # 必然失败，整个 tests/agent（近百个用例）在 CI 里一直被静默跳过。
      # 导出同时写服务端那份 spec.json，测试里读 spec 也不必再从代码现算。
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: 导出内嵌基线 spec
        run: PYTHON=python scripts/export-spec.sh

      # 预先编好一份交给夹具复用（MOVIECLAW_CLI_BIN）：否则每个 xdist worker
      # 各自现场 go build，首个 Agent 用例的 setup 要多等十几秒
      - name: 编译 mclaw
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/mclaw" ./cmd/mclaw
          echo "MOVIECLAW_CLI_BIN=$RUNNER_TEMP/mclaw" >> "$GITHUB_ENV"

      - name: 恢复 NER 模型缓存
        id: ner-cache
        uses: actions/cache@v4
        with:
          path: data/models/torrent-ner
          key: ner-model-${{ env.NER_MODEL_TAG }}

      - name: 下载 NER 模型（缓存未命中时）
        if: steps.ner-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$NER_MODEL_TAG" \
            --repo "${{ github.repository }}" \
            --dir data/models/torrent-ner

      # 全仓库一次就够，放在第一片
      - name: ruff
        if: matrix.shard == 1
        run: ruff check .

      # -n auto 按 runner 核数并行（ubuntu-latest 4 核，串行 9 分半 → 3 分内）。
      # --dist loadfile 让同一文件的用例固定在同一 worker 串行执行：
      # tests/docker/test_entrypoint_supervision.py 会绑定固定端口（8000/3001），
      # 跨 worker 并发跑同文件用例会端口冲突，loadfile 从分发层面杜绝。
      # --durations=30：列出最慢的用例供定位。
      # --timeout=180：单用例（含夹具收尾）上限。CI 上最慢的正常用例十几秒；
      # 超时即失败并打出全部线程栈，卡死不再拖住整个作业、也能直接看出是谁。
      # 不再额外加 -q：pyproject 的 addopts 已有一个，叠成 -qq 会吞掉末尾的
      # 「N passed in Xs」汇总行。
      - name: pytest
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/3
        run: python -m pytest -m "not integration" -n auto --dist loadfile --durations=30 --timeout=180

  cli-go:
    needs: changes
    if: needs.changes.outputs.cli-go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      # 内嵌基线 spec 是构建产物不入 git，go:embed 找不到文件连 vet 都过不去：
      # 先用服务端的 export_openapi 现场导出（跨语言指纹比对测试也要 Python）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装服务端依赖（导出内嵌 spec 与跨语言指纹比对用）
        run: pip install -e .

      - name: 导出内嵌基线 spec
        run: scripts/export-spec.sh

      - name: gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: cli
        run: go vet ./...

      - name: go test
        working-directory: cli
        run: go test ./...

      # 六个分发目标都得编得过：任何一个挂了，那批用户就装不上
      # （目标清单与 cli/.goreleaser.yaml 的 goos × goarch 保持一致）
      - name: 交叉编译六平台
        working-directory: cli
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -o /tmp/mclaw-check ./cmd/mclaw
            echo "✓ $target"
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json 未声明 packageManager，须显式给版本（与 release.yml 一致）
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm web:lint

      - name: typecheck
        run: pnpm web:typecheck

  # macOS Worker 的构建门禁。开发者多数在 Linux/容器里改代码，Swift 侧的
  # 编译错误在本地完全暴露不出来，只能靠这里拦。
  #
  # 用 macos-26：界面的液态玻璃（NSGlassEffectView 等）要 Xcode 26 的 macOS 26
  # SDK 才编得进来。代码对旧工具链有 `#if compiler(>=6.2)` 兜底，换回旧 runner
  # 也能编过，只是产物会退回非玻璃样式——门禁要和发版用同一套工具链才有意义。
  worker-macos:
    needs: changes
    if: needs.changes.outputs.worker-macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 输出工具链版本（排障时先看这行）
        run: swift --version

      - name: 构建
        run: swift build --package-path macos/MovieClawTranscoder -c release

      - name: 单测
        run: swift test --package-path macos/MovieClawTranscoder
