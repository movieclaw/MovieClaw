# =============================================================================
# iOS / Apple TV / Mac App 编译检查
#
# 引擎的受测工具链为 Xcode 27（与上游相同）；App CI 与发版都使用同一镜像。
# 构建固定使用入库的 Package.resolved，远程 fork 和传递依赖不会随 main / tag 漂移。
#
# 普通 PR 编 Debug：这类问题是 Xcode 版本差异，Debug 下一样报错；Release 整模块优化改一行也要
# 整个模块重编，以前 iPhone + Apple TV 要 20 分钟，拖慢合并。只在整模块优化下才暴露的编译器问题、
# `#if DEBUG` 的另一支，留给发版 PR（bump 版本号）按 Release 编，与发版的 ios-ipa 作业同口径，
# 在 tag 推出去之前拦下。
#
# iPhone、Apple TV、Mac 三个作业并行，按改动路径各自决定跑不跑（Mac 版同样随发版出附件，
# release.yml 的 mac-app 作业，同理要在 PR 阶段按 CI 的 Xcode 编过）。用作业级 if 而不是工作流级 paths
# 过滤（同 ci.yml）：被 if 跳过的作业记为 skipped、视同通过，设为分支保护的必需检查也不会让
# 没改 App 的 PR 卡在「检查未完成」。路径清单要覆盖各 App 目标真正编到的目录（见 project.yml），
# 新增跨目录的源码时同步下面的 filters。
# =============================================================================
name: ios

on:
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: "编译配置（三个 App 都编）"
        type: choice
        options: [Release, Debug]
        default: Release

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      iphone: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.iphone == 'true' }}
      tv: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tv == 'true' }}
      mac: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mac == 'true' }}
      configuration: ${{ inputs.configuration || (steps.filter.outputs.release == 'true' && 'Release' || 'Debug') }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # 发版 PR（bump 版本号）：三个 App 都按 Release 编
            release: &release
              - "src/movieclaw_api/__init__.py"
            common: &common
              - *release
              - ".github/workflows/ios.yml"
              - ".github/workflows/release.yml"
              - "apps/apple/scripts/**"
              - "apps/apple/project.yml"
              - "apps/apple/XcodeConfig/**"
              - "apps/apple/Shared/**"
              - "apps/apple/AetherCore/**"
              - "apps/apple/Package.resolved"
            iphone:
              - *common
              - "apps/apple/MovieClaw/**"
              - "apps/apple/MovieClawNotificationService/**"
              - "apps/apple/PushShared/**"
            tv:
              - *common
              - "apps/apple/MovieClawTV/**"
              - "apps/apple/MovieClawTVTopShelf/**"
            mac:
              - *common
              - "apps/apple/MovieClawMac/**"

  iphone:
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    # 与 release.yml 的 ios-ipa 作业同一个 runner 镜像
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      # 缓存 Swift 包（远程包的检出与 FFmpegBuild 等二进制框架），省掉每次从头拉取。
      # Package.resolved 与工程声明一同入库，构建只使用锁定版本；缓存不会改变解析结果。
      - name: 恢复 Swift 包缓存
        uses: actions/cache@v4
        with:
          path: ~/workspace/.mc-ios-spm
          key: ios-spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Package.resolved') }}
          restore-keys: ios-spm-

      - name: 检查依赖锁定约束
        run: python3 -m unittest discover -s apps/apple/scripts/tests

      - name: 编译 iPhone 版（${{ needs.changes.outputs.configuration }}）
        run: apps/apple/scripts/ci-build.sh MovieClaw iOS ${{ needs.changes.outputs.configuration }}

      - name: 失败时上传完整编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-log
          path: apps/apple/build-ci/MovieClaw.log

  # Apple TV 版（docs/design/tvos-app.md）：与 iPhone 版共用 Shared/ 与播放引擎，改到共享代码时两端都要能编过
  tv:
    needs: changes
    if: needs.changes.outputs.tv == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: 恢复 Swift 包缓存
        uses: actions/cache@v4
        with:
          path: ~/workspace/.mc-ios-spm
          key: ios-spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Package.resolved') }}
          restore-keys: ios-spm-

      - name: 编译 Apple TV 版（${{ needs.changes.outputs.configuration }}）
        run: apps/apple/scripts/ci-build.sh MovieClawTV tvOS ${{ needs.changes.outputs.configuration }}

      - name: 失败时上传完整编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-build-log
          path: apps/apple/build-ci/MovieClawTV.log

  # Mac 版（docs/design/macos-app.md）：与 iPhone、Apple TV 版共用 Shared/ 与播放引擎
  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # 与 release.yml 的 mac-app 作业同一个 runner 镜像
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: 恢复 Swift 包缓存
        uses: actions/cache@v4
        with:
          path: ~/workspace/.mc-ios-spm
          key: ios-spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Package.resolved') }}
          restore-keys: ios-spm-

      - name: 编译 Mac 版（${{ needs.changes.outputs.configuration }}）
        run: apps/apple/scripts/ci-build.sh MovieClawMac macOS ${{ needs.changes.outputs.configuration }}

      - name: 失败时上传完整编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: apps/apple/build-ci/MovieClawMac.log
