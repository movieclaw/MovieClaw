name: downloads
on:
  pull_request:
    paths: [scripts/build-download-manifest.py, scripts/publish-download-manifest.sh, scripts/release-asset-plan.sh, 'scripts/tests/**', 'apps/android/scripts/**', .github/workflows/release.yml, .github/workflows/downloads.yml]
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests
