name: Watch presence plugin contracts

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/windows-*', 'codex/**']
    paths:
      - 'plugins/watch-presence/**'
      - '.github/workflows/watch-presence.yml'
      - 'src/movieclaw_api/plugins/**'
      - 'src/movieclaw_api/api/deps.py'
      - 'src/movieclaw_api/services/auth.py'
      - 'src/movieclaw_api/services/library/access.py'
      - 'src/movieclaw_api/services/playback_activity.py'
      - 'src/movieclaw_db/**'
      - 'src/movieclaw_kernel/**'
      - 'src/movieclaw_playback/activity.py'
      - 'src/movieclaw_playback/events.py'
      - 'pyproject.toml'
      - 'tests/conftest.py'
  pull_request:
    paths:
      - 'plugins/watch-presence/**'
      - '.github/workflows/watch-presence.yml'
      - 'src/movieclaw_api/plugins/**'
      - 'src/movieclaw_api/api/deps.py'
      - 'src/movieclaw_api/services/auth.py'
      - 'src/movieclaw_api/services/library/access.py'
      - 'src/movieclaw_api/services/playback_activity.py'
      - 'src/movieclaw_db/**'
      - 'src/movieclaw_kernel/**'
      - 'src/movieclaw_playback/activity.py'
      - 'src/movieclaw_playback/events.py'
      - 'pyproject.toml'
      - 'tests/conftest.py'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: baseline-0.36
            ref: 6b3b93305dd854e94ed0a118b08a10e37ce70932
          - host: current
            ref: main
    name: host-contract (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: movieclaw/MovieClaw
          # Upstream PRs test their exact merge candidate; the Windows release
          # repository tests the current upstream host rather than its older copy.
          ref: ${{ matrix.host == 'current' && github.repository == 'movieclaw/MovieClaw' && github.sha || matrix.ref }}
          path: server-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Record the tested host source
        working-directory: server-baseline
        run: git rev-parse HEAD
      - name: Install host test dependencies
        working-directory: server-baseline
        run: |
          uv venv .venv
          uv pip install -e '.[dev]'
      - name: Install the distributable in a real authenticated host
        env:
          WATCH_PRESENCE_SOURCE: ${{ github.workspace }}/plugins/watch-presence
          WATCH_PRESENCE_PACKAGE: ${{ github.workspace }}/plugin-dist/MovieClaw-Watch-Presence-1.0.0.mcplugin
        run: |
          python plugins/watch-presence/package.py --output "$WATCH_PRESENCE_PACKAGE"
          cp plugins/watch-presence/tests/test_presence.py server-baseline/tests/api/test_watch_presence_plugin.py
          cp plugins/watch-presence/tests/test_policy.py server-baseline/tests/api/test_watch_presence_policy.py
          cd server-baseline
          uv run --no-project python -m pytest tests/api/test_watch_presence_plugin.py tests/api/test_watch_presence_policy.py --junitxml=../plugin-dist/contract-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-presence-${{ github.sha }}-${{ matrix.host }}
          path: plugin-dist
          if-no-files-found: error
