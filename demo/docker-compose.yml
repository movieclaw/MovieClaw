# =============================================================================
# MovieClaw 公开演示站（设计见 docs/design/demo-site.md，部署步骤见 demo/README.md）
#
# 本文件与 Caddyfile、reset.sh、accounts.json 一起放在服务器的演示站目录下：
#   ./data             运行数据（建站后打成 golden-data.tar.gz，每天还原一次）
#   ./media            demo/fetch_content.py 整理好的影片与图片（只读挂载）
#   ./accounts.json    登录页公布的演示账号（与建站脚本用的是同一份）
#   ./.env             DEMO_DOMAIN=演示站域名，MOVIECLAW_DEMO_IMAGE=镜像名；可选：
#                      DEMO_PROXY=external（服务器上已有 nginx 占着 80/443，不起 Caddy，
#                      用 nginx-site.conf.template 反代）、DEMO_HTTP_PORT（本机端口，默认 3000）、
#                      DEMO_MEM_LIMIT（内存上限，默认 3g）
#
# 建站时要临时关掉演示模式（只读守卫会拒绝建库、建成员），并且**必须先停掉 Caddy**：
# 非演示模式的实例一旦经 Caddy 暴露在公网，任何人都能抢先注册超管。
#   docker compose down
#   MOVIECLAW_DEMO_MODE=false docker compose up -d movieclaw
# 建站完成后由 ./reset.sh snapshot 以演示模式重新拉起并自检，通过后才启动 Caddy。
# =============================================================================
name: movieclaw-demo

services:
  movieclaw:
    # 必须用本分支（feat/demo）构建的镜像：官方镜像没有演示模式
    image: ${MOVIECLAW_DEMO_IMAGE:-movieclaw:demo}
    container_name: movieclaw-demo
    init: true
    restart: unless-stopped
    ports:
      # 只给本机：公网流量一律经 Caddy 或宿主机 nginx（HTTPS），建站脚本经这个口访问
      - "127.0.0.1:${DEMO_HTTP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      # 只读：即便哪条路漏了，也删不掉、改不了演示内容
      - ./media:/media:ro
      # 可写工作目录（demo-site.md §10）：演示下载器的下载目录与新入库影片的落点，
      # 每日还原时清空
      - ./workspace:/workspace
      - ./accounts.json:/demo/accounts.json:ro
    environment:
      - TZ=Asia/Shanghai
      # 关掉 /docs 与 openapi.json，不向匿名访客暴露完整接口面
      - APP_ENV=production
      # 演示模式：全站只读、登录页公布账号、访客之间信息脱敏、应用内更新失效
      - MOVIECLAW_DEMO_MODE=${MOVIECLAW_DEMO_MODE:-true}
      - MOVIECLAW_DEMO_ACCOUNTS_FILE=/demo/accounts.json
      # 演示资源站的种子目录与演示下载器的默认下载目录（demo-site.md §10）
      - MOVIECLAW_DEMO_SEED_DIR=/media/_资源站
      - MOVIECLAW_DEMO_DOWNLOAD_DIR=/workspace/downloads
      # App Store 审核账号：只写在 .env 里，不进仓库；密码留空即不启用（demo-site.md §9）
      - MOVIECLAW_DEMO_REVIEW_USERNAME=${MOVIECLAW_DEMO_REVIEW_USERNAME:-appreview}
      - MOVIECLAW_DEMO_REVIEW_PASSWORD=${MOVIECLAW_DEMO_REVIEW_PASSWORD:-}
      # 公网只走 HTTPS（Caddy 终结 TLS），会话 Cookie 只经 https 传输
      - SESSION_COOKIE_SECURE=true
      # 运行日志里有访客 IP：只留 7 天
      - LOG_RETENTION_DAYS=7
      # 信任本网段（Caddy）转发的 X-Forwarded-For，服务端才看得到访客的真实 IP；
      # 不配的话所有访客都是 Caddy 的地址，按 IP 的登录限频会退化成全站共用一个桶。
      # Caddy 默认不信访客自带的 X-Forwarded-For，所以访客伪造不了
      - FORWARDED_ALLOW_IPS=127.0.0.1,172.31.250.0/24
      # TMDB Key 在构建镜像时已烧入；要换 Key 取消注释：
      # - TMDB_API_KEY=你的 key
    # 小机器上给反代与系统留点余量（按 VPS 规格调整；4 GB 内存的独占机器用 3g，
    # 与其他服务共用的机器在 .env 里调小）
    mem_limit: ${DEMO_MEM_LIMIT:-3g}
    # 容器标准输出日志限量轮转：默认的 json-file 不限大小，时间一长能把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # 服务器上已有 nginx 占着 80/443 时不用 Caddy（DEMO_PROXY=external）：
    # 放进 profile，只有 reset.sh 在 Caddy 模式下才会点名启动它
    profiles: ["caddy"]
    image: caddy:2
    container_name: movieclaw-demo-caddy
    restart: unless-stopped
    depends_on:
      - movieclaw
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DEMO_DOMAIN=${DEMO_DOMAIN:?请在 .env 里设置 DEMO_DOMAIN（演示站域名）}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # 反代本身很省内存，给个上限防止异常流量把整机拖垮
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 固定网段：FORWARDED_ALLOW_IPS 按它信任 Caddy。与服务器上已有的网段冲突时，两处一起改
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  caddy-data:
  caddy-config:
