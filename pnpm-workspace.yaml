# 只列 JS 项目：apps/ 下还有原生 App（apple/ 是 Xcode 工程，将来的 android/ 是 Gradle 工程），不能用 apps/* 通配
packages:
  - "apps/web"
  - "apps/extension"
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  lfa-ponyfill: false
  sharp: true
  spawn-sync: false
  unrs-resolver: true

# 渐进 fMP4 延续片段保持时间轴；端到端守卫见 test_remote_transcode_e2e.py。
patchedDependencies:
  hls.js@1.7.1: patches/hls.js@1.7.1.patch
